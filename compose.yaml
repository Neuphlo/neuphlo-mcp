services:
  neuphlo-mcp:
    image: neuphlo-mcp-template:0.3.0
    build:
      context: .
    ports:
      - "127.0.0.1:${MCP_PORT:-3000}:3000"
    environment:
      MCP_APP_NAME: ${MCP_APP_NAME:-Documentation}
      MCP_CONTENT_ROOT: /data/content
      MCP_WRITE_MODE: ${MCP_WRITE_MODE:-direct}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],knowledge-mcp}
      MCP_READ_TOKEN: ${MCP_READ_TOKEN:-}
      MCP_WRITE_TOKEN: ${MCP_WRITE_TOKEN:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ACCESS_POLICY_PATH: ${MCP_ACCESS_POLICY_PATH:-}
      MCP_REFERENCE_HASH_KEY: ${MCP_REFERENCE_HASH_KEY:-}
      MCP_LOG_IPS: ${MCP_LOG_IPS:-false}
    volumes:
      - ${MCP_CONTENT_DIR:-./content}:/data/content
    restart: unless-stopped
